<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sango Hiring Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  /* Layout: one column — sticky header with counts + filters, then roles grouped by lokasi/divisi */
  :root {
    --bg: #F1F3F6;
    --surface: #FFFFFF;
    --surface-2: #F7F8FA;
    --ink: #15171C;
    --muted: #5E6472;
    --line: #DCE0E7;
    --accent: #1F5FA9;
    --urgent: #B3261E;
    --s-open: #5B6677;
    --s-kandidat: #9A5B0B;
    --s-interview: #1D4ED8;
    --s-offer: #6D28D9;
    --s-joining: #0F766E;
    --s-selesai: #15803D;
    --s-hold: #9F1239;
    --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
    --font-body: "Inter", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121419;
      --surface: #1B1E25;
      --surface-2: #22262E;
      --ink: #ECEEF2;
      --muted: #9BA3B2;
      --line: #2C313B;
      --accent: #7FB0EC;
      --urgent: #F2897F;
      --s-open: #9BA3B2;
      --s-kandidat: #E0A33F;
      --s-interview: #7FA8F5;
      --s-offer: #BB9BF2;
      --s-joining: #5EC4B6;
      --s-selesai: #6DC481;
      --s-hold: #F08EA8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121419;
    --surface: #1B1E25;
    --surface-2: #22262E;
    --ink: #ECEEF2;
    --muted: #9BA3B2;
    --line: #2C313B;
    --accent: #7FB0EC;
    --urgent: #F2897F;
    --s-open: #9BA3B2;
    --s-kandidat: #E0A33F;
    --s-interview: #7FA8F5;
    --s-offer: #BB9BF2;
    --s-joining: #5EC4B6;
    --s-selesai: #6DC481;
    --s-hold: #F08EA8;
    color-scheme: dark;
  }

  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.45; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  * { box-sizing: border-box; }

  .wrap {
    max-width: 1060px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .top-inner { padding-block: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .titlerow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; min-width: 0; }
  h1 { font-family: var(--font-head); font-size: clamp(1.15rem, 3.4vw, 1.5rem); font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  .asof { color: var(--muted); font-size: 0.78rem; }
  .counts { display: flex; flex-wrap: wrap; gap: 8px; }
  .count {
    display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 10px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2);
    font-size: 0.74rem; color: var(--muted); letter-spacing: 0.02em;
    font-family: inherit; cursor: pointer;
  }
  .count:hover { border-color: var(--muted); }
  .count:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .count[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .count[aria-pressed="true"] b { color: var(--surface); }
  .count b { font-family: var(--font-head); font-size: 0.95rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .count.urgent { border-color: color-mix(in srgb, var(--urgent) 45%, var(--line)); }
  .count.urgent b { color: var(--urgent); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip {
    font: inherit; font-size: 0.76rem; padding: 5px 11px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
  }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .chip:focus-visible, .btn:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .spacer { flex: 1 1 auto; }
  .btn {
    font: inherit; font-size: 0.78rem; font-weight: 500; padding: 6px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  .btn.ghost { background: transparent; color: var(--accent); }

  main { padding-block: 18px 56px; display: flex; flex-direction: column; gap: 26px; }

  #list { display: flex; flex-direction: column; gap: 40px; }
  section.group { border-top: 3px solid var(--ink); padding-top: 14px; }
  .group-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 12px; min-width: 0; }
  .group-head h2 { font-family: var(--font-head); font-size: 1.12rem; font-weight: 700; margin: 0; color: var(--ink); letter-spacing: -0.005em; text-wrap: balance; }
  .group-head .n { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
  .rows { display: flex; flex-direction: column; gap: 8px; }

  .row {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; display: grid; gap: 10px 14px; min-width: 0;
    grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) auto;
    align-items: start;
  }
  .row.is-urgent { border-left: 3px solid var(--urgent); padding-left: 12px; }
  .row.is-done { opacity: 0.62; }
  .role { font-weight: 600; font-size: 0.93rem; min-width: 0; }
  .meta { font-size: 0.76rem; color: var(--muted); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .tag-urgent { color: var(--urgent); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.68rem; }
  .field { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
  input.cell {
    font: inherit; font-size: 0.84rem; color: var(--ink); background: transparent;
    border: 1px solid transparent; border-bottom-color: var(--line); border-radius: 4px;
    padding: 3px 5px; width: 100%; min-width: 0;
  }
  input.cell:hover { background: var(--surface-2); }
  input.cell::placeholder { color: color-mix(in srgb, var(--muted) 65%, transparent); }
  .statusbox { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  select.status {
    font: inherit; font-size: 0.78rem; font-weight: 600; padding: 5px 8px; border-radius: 999px; cursor: pointer;
    border: 1px solid currentColor; background: transparent; color: var(--s-open);
  }
  select.status option { color: var(--ink); background: var(--surface); font-weight: 400; }
  .st-Open { color: var(--s-open); } .st-Kandidat { color: var(--s-kandidat); }
  .st-Interview { color: var(--s-interview); } .st-Offer { color: var(--s-offer); }
  .st-Joining { color: var(--s-joining); } .st-Selesai { color: var(--s-selesai); }
  .st-Hold { color: var(--s-hold); }
  .notewrap { grid-column: 1 / -1; }
  .rowfoot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 0.7rem; color: var(--muted); }
  .linkbtn { font: inherit; font-size: 0.7rem; background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px 4px; border-radius: 4px; text-decoration: underline; }
  .linkbtn:hover { color: var(--urgent); }

  @media (max-width: 640px) {
    .row { grid-template-columns: minmax(0, 1fr); }
    .statusbox { align-items: flex-start; }
  }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .panel .field input, .panel .field select { font: inherit; font-size: 0.84rem; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: var(--ink); width: 100%; min-width: 0; }
  .panel .actions { grid-column: 1 / -1; display: flex; gap: 8px; }

  .state { text-align: center; padding: 44px 10px; color: var(--muted); font-size: 0.86rem; }
  .state b { display: block; font-family: var(--font-head); color: var(--ink); font-size: 1rem; margin-bottom: 6px; }
  .note-banner { background: color-mix(in srgb, var(--urgent) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--urgent) 35%, var(--line)); color: var(--ink); border-radius: 8px; padding: 9px 12px; font-size: 0.8rem; }
  @media (prefers-reduced-motion: no-preference) { .row { transition: opacity .15s ease; } }
  .val { font-size: 0.86rem; color: var(--ink); padding: 3px 0; overflow-wrap: anywhere; }
  .val.empty { color: var(--muted); }
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
  .gate-card { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .gate-card h1 { font-size: 1.25rem; }
  .gate-card p { margin: 0; color: var(--muted); font-size: 0.86rem; }
  .gate-card input[type=password] { font: inherit; font-size: 0.95rem; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--ink); }
  .gate-card .btn { padding: 9px 12px; font-size: 0.9rem; }
  .rem { display: flex; gap: 8px; align-items: center; font-size: 0.8rem; color: var(--muted); }
  .err { color: var(--urgent) !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .pill { display: inline-block; font-size: 0.78rem; font-weight: 600; padding: 4px 11px; border-radius: 999px; border: 1px solid currentColor; }
</style>
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<div id="gate" class="gate">
  <form id="gateForm" class="gate-card" autocomplete="on">
    <h1>Sango Hiring Tracker</h1>
    <p>Masukkan password untuk melihat tracker.</p>
    <label for="pw" class="sr">Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <label class="rem"><input id="remember" type="checkbox" checked> Ingat di perangkat ini</label>
    <button class="btn" type="submit">Buka</button>
    <p id="gateErr" class="err" hidden>Password salah. Coba lagi.</p>
  </form>
</div>
<div id="app" hidden>
<header class="top">
  <div class="wrap top-inner">
    <div class="titlerow">
      <h1>Sango Hiring Tracker</h1>
      <span class="asof" id="asof"></span>
    </div>
    <div class="counts" id="counts"></div>
    <div class="toolbar">
      <button class="chip" data-filter="all" aria-pressed="true">Semua</button>
      <button class="chip" data-filter="open" aria-pressed="false">Belum selesai</button>
      <button class="chip" data-filter="urgent" aria-pressed="false">Urgent</button>
      <span class="spacer"></span>
      <button class="chip" id="lock" type="button">Kunci</button>
    </div>
  </div>
</header>
<div class="wrap">
  <main>
    <div id="banner" hidden></div>
    <div id="list"><div class="state"><b>Memuat tracker…</b>Posisi yang sedang dicari akan muncul di sini.</div></div>
  </main>
</div>
</div>
<script>
  const STATUSES = ["Open", "Kandidat", "Interview", "Offer", "Joining", "Selesai", "Hold"];
  const DONE = new Set(["Selesai"]);
  const listEl = document.getElementById("list");
  const countsEl = document.getElementById("counts");
  let rows = [], filter = "all";

  function visible(r) {
    if (filter === "open") return !DONE.has(r.status);
    if (filter === "urgent") return r.priority === "urgent" && !DONE.has(r.status);
    if (filter === "moving") return ["Interview", "Offer", "Joining"].includes(r.status);
    if (filter === "done") return DONE.has(r.status);
    return true;
  }
  function setFilter(f) {
    filter = f;
    document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.filter === f)));
    render();
  }
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => setFilter(c.dataset.filter)));

  function renderCounts() {
    const n = fn => rows.filter(fn).length;
    countsEl.innerHTML = "";
    [["Urgent", n(r => r.priority === "urgent" && !DONE.has(r.status)), true, "urgent"],
     ["Masih dicari", n(r => !DONE.has(r.status)), false, "open"],
     ["Interview / offer / joining", n(r => ["Interview", "Offer", "Joining"].includes(r.status)), false, "moving"],
     ["Selesai", n(r => DONE.has(r.status)), false, "done"]].forEach(([label, v, urg, f]) => {
      const el = document.createElement("button");
      el.type = "button"; el.className = "count" + (urg ? " urgent" : "");
      el.setAttribute("aria-pressed", String(filter === f));
      el.addEventListener("click", () => setFilter(filter === f ? "all" : f));
      const b = document.createElement("b"); b.textContent = v;
      const s = document.createElement("span"); s.textContent = label;
      el.append(b, s); countsEl.appendChild(el);
    });
  }
  function field(label, value, emptyText) {
    const w = document.createElement("div"); w.className = "field";
    const l = document.createElement("label"); l.textContent = label;
    const v = document.createElement("div"); v.className = "val" + (value ? "" : " empty"); v.textContent = value || emptyText;
    w.append(l, v); return w;
  }
  function rowNode(r) {
    const done = DONE.has(r.status), urgent = r.priority === "urgent" && !done;
    const el = document.createElement("article");
    el.className = "row" + (urgent ? " is-urgent" : "") + (done ? " is-done" : "");
    const head = document.createElement("div");
    const t = document.createElement("div"); t.className = "role"; t.textContent = r.role || "";
    const meta = document.createElement("div"); meta.className = "meta";
    const add = (txt, cls) => { const s = document.createElement("span"); if (cls) s.className = cls; s.textContent = txt; meta.appendChild(s); };
    if (urgent) add("Urgent", "tag-urgent");
    if (r.priority === "low") add("Low priority");
    if (r.loc) add(r.loc);
    add("PIC: " + (r.pic || "–"));
    head.append(t, meta);
    const sbox = document.createElement("div"); sbox.className = "statusbox";
    const st = STATUSES.includes(r.status) ? r.status : "Open";
    const p = document.createElement("span"); p.className = "pill st-" + st; p.textContent = st;
    sbox.appendChild(p);
    const nw = document.createElement("div"); nw.className = "notewrap"; nw.appendChild(field("Catatan", r.note, "–"));
    const foot = document.createElement("div"); foot.className = "rowfoot"; foot.textContent = "Update: " + (r.updated || "–");
    el.append(head, field("Kandidat", r.candidate, "belum ada"), sbox, nw, foot);
    return el;
  }
  function render() {
    renderCounts();
    const shown = rows.filter(visible);
    listEl.innerHTML = "";
    if (!shown.length) { listEl.innerHTML = '<div class="state"><b>Tidak ada posisi di filter ini</b>Ganti filter di atas untuk melihat posisi lain.</div>'; return; }
    const order = [], by = new Map();
    shown.forEach(r => { const g = r.group || "Lainnya"; if (!by.has(g)) { by.set(g, []); order.push(g); } by.get(g).push(r); });
    order.forEach(g => {
      const sec = document.createElement("section"); sec.className = "group";
      const h = document.createElement("div"); h.className = "group-head";
      const h2 = document.createElement("h2"); h2.textContent = g;
      const n = document.createElement("span"); n.className = "n";
      n.textContent = by.get(g).filter(r => !DONE.has(r.status)).length + " dari " + by.get(g).length + " masih jalan";
      h.append(h2, n);
      const wrap = document.createElement("div"); wrap.className = "rows";
      by.get(g).forEach(r => wrap.appendChild(rowNode(r)));
      sec.append(h, wrap); listEl.appendChild(sec);
    });
  }
  const gate = document.getElementById("gate"), gateForm = document.getElementById("gateForm"), gateErr = document.getElementById("gateErr");
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function unlock(pw) {
    const d = await (await fetch("data.enc.json?t=" + Date.now())).json();
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(d.salt), iterations: d.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(d.iv) }, key, b64(d.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  function show(d) {
    gate.hidden = true; document.getElementById("app").hidden = false;
    rows = (d.roles || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
    document.getElementById("asof").textContent = "Terakhir diperbarui " + new Date(d.synced + "T00:00:00").toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
    render();
  }
  async function tryPw(pw, remember) {
    try {
      const d = await unlock(pw);
      try { if (remember) localStorage.setItem("sht-pw", pw); } catch (e) {}
      show(d); return true;
    } catch (e) { return false; }
  }
  gateForm.addEventListener("submit", async e => {
    e.preventDefault();
    gateErr.hidden = true;
    const btn = gateForm.querySelector("button"); btn.disabled = true; btn.textContent = "Membuka…";
    const ok = await tryPw(document.getElementById("pw").value, document.getElementById("remember").checked);
    btn.disabled = false; btn.textContent = "Buka";
    if (!ok) { gateErr.hidden = false; document.getElementById("pw").select(); }
  });
  document.getElementById("lock").addEventListener("click", () => { try { localStorage.removeItem("sht-pw"); } catch (e) {} location.reload(); });
  (async () => { let saved = null; try { saved = localStorage.getItem("sht-pw"); } catch (e) {} if (!saved || !(await tryPw(saved, true))) { try { localStorage.removeItem("sht-pw"); } catch (e) {} document.getElementById("pw").focus(); } })();
</script>
</body>
</html>
